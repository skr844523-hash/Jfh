name: Build NEXORA AI Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Pre-accept Android SDK Licenses
        run: |
          echo "==> Configuring Android SDK license acceptance..."
          mkdir -p "$ANDROID_HOME/licenses"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          
          # Write known license hashes to avoid invoking failing sdkmanager binaries
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n89339edd9526690e012448087f764f95e7385f27" | tee "$ANDROID_HOME/licenses/android-sdk-license" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo -e "\n84831b9409646a2495f2980ff52642dd43a612ee" | tee "$ANDROID_HOME/licenses/android-sdk-preview-license" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo -e "\n79124426920f34023a5f4486d34b7f940dcf999b\n84831b9409646a2495f2980ff52642dd43a612ee" | tee "$ANDROID_HOME/licenses/android-googletv-license" > "$ANDROID_SDK_ROOT/licenses/android-googletv-license"
          echo -e "\n601085b94cd77f0b54ff864069554489b3c4b6d6" | tee "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license" > "$ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license"
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" | tee "$ANDROID_HOME/licenses/google-gdk-license" > "$ANDROID_SDK_ROOT/licenses/google-gdk-license"
          echo -e "\ne9acab5b5fbb560a72cfa4e73c0cb0f776f9ed78" | tee "$ANDROID_HOME/licenses/mips-android-sysimage-license" > "$ANDROID_SDK_ROOT/licenses/mips-android-sysimage-license"
          echo "Licenses successfully configured."

      - name: Cache Robolectric Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/robolectric
            ~/.cache/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x gradlew

      - name: Prepare Secrets Configuration
        run: |
          # Generate placeholder .env if not exists so secrets-gradle-plugin succeeds
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=\"${{ secrets.GEMINI_API_KEY }}\"" > .env
          fi

      - name: Run Unit Tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            echo "✅ Successfully generated APK:"
            ls -lh app/build/outputs/apk/debug/*.apk
          else
            echo "❌ Error: app-debug.apk was not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
